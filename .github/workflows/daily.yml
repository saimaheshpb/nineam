name: Daily NineAM edition

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Optional edition date in YYYY-MM-DD format
        required: false
        type: string
  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: nineam-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EDITION_DATE: ${{ inputs.edition_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect source articles
        run: python main.py
      - name: Run the publication gate
        shell: bash
        run: |
          if [[ -n "$EDITION_DATE" ]]; then
            python run_daily.py --edition-date "$EDITION_DATE"
          else
            python run_daily.py
          fi
      - name: Build static site
        shell: bash
        run: |
          if [[ -n "$EDITION_DATE" ]]; then
            python build_site.py --edition-date "$EDITION_DATE" --output dist
          else
            python build_site.py --output dist
          fi
      - name: Deploy static artifact to Vercel
        run: npx --yes vercel@latest deploy dist --prod --yes --token="$VERCEL_TOKEN"
