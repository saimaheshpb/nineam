name: Daily NineAM edition

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Optional edition date in YYYY-MM-DD format
        required: false
        type: string
  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: nineam-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      EVIDENCE_EXTRACTION_MODEL: openai/gpt-5.6-luna
      ARTICLE_GENERATION_MODEL: openai/gpt-5.6-terra
      CLAIM_EXTRACTION_MODEL: openai/gpt-5.6-luna
      CLAIM_JUDGE_MODEL: openai/gpt-5.6-luna
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve edition date
        id: edition
        shell: bash
        env:
          REQUESTED_EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          if [[ -n "$REQUESTED_EDITION_DATE" ]]; then
            edition_date="$REQUESTED_EDITION_DATE"
          else
            edition_date="$(TZ=Asia/Kolkata date +%F)"
          fi
          if [[ ! "$edition_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid edition date: $edition_date" >&2
            exit 2
          fi
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$edition_date" > edition-date.txt
      - name: Collect source articles
        run: python main.py --edition-date "${{ steps.edition.outputs.date }}"
      - name: Generate edition
        run: python run_daily.py --edition-date "${{ steps.edition.outputs.date }}"
      - name: Upload edition-date handoff
        uses: actions/upload-artifact@v4
        with:
          name: nineam-edition-date
          path: edition-date.txt
      - name: Build static site
        run: >-
          python build_site.py
          --edition-date "${{ steps.edition.outputs.date }}"
          --output dist
      - name: Deploy static artifact to Vercel
        run: npx --yes vercel@latest deploy dist --prod --yes --token="$VERCEL_TOKEN"
