name: Evaluate NineAM edition

on:
  workflow_run:
    workflows:
      - Daily NineAM edition
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      edition_date:
        description: Edition date in YYYY-MM-DD format
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nineam-daily
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      EVIDENCE_EXTRACTION_MODEL: openai/gpt-5.6-luna
      ARTICLE_GENERATION_MODEL: alibaba/qwen3.8-max-0902
      CLAIM_EXTRACTION_MODEL: openai/gpt-5.6-luna
      CLAIM_JUDGE_MODEL: deepseek/deepseek-v4.1-flash
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out publisher revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check out current revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Download publisher handoff
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: nineam-edition-date
          path: handoff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Create manual handoff
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          mkdir -p handoff
          printf '%s\n' "$REQUESTED_EDITION_DATE" > handoff/edition-date.txt
      - name: Resolve edition date
        id: edition
        shell: bash
        run: |
          edition_date="$(tr -d '\r\n' < handoff/edition-date.txt)"
          if [[ ! "$edition_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid edition date: $edition_date" >&2
            exit 2
          fi
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate edition
        run: python evaluate_article.py --edition-date "${{ steps.edition.outputs.date }}"
      - name: Build evaluated static site
        run: >-
          python build_site.py
          --edition-date "${{ steps.edition.outputs.date }}"
          --output dist
      - name: Deploy evaluated artifact to Vercel
        run: npx --yes vercel@latest deploy dist --prod --yes --token="$VERCEL_TOKEN"
